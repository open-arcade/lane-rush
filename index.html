<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lane Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d6cc;--sign:#0f7b4f;--hot:#ff7a1a;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a}}
:root[data-theme="dark"]{--bg:#14161a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f1e6}
#wrap{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(14,16,20,.9);text-align:center;padding:20px}
.ov.hide{display:none}
.ov{justify-content:flex-start;overflow-y:auto;gap:8px;padding:22px 12px;background:radial-gradient(120% 70% at 50% 0%,#1d3b4f 0%,#0e1014 70%)}
#pv{width:240px;height:130px;max-width:100%;flex:none}
#name{font-family:Bungee,Impact,sans-serif;font-size:22px;color:#fff;margin-top:-6px}
#gar{display:flex;gap:8px;overflow-x:auto;width:100%;padding:6px 4px 10px;scroll-snap-type:x proximity;flex:none}
.sw{flex:0 0 84px;scroll-snap-align:center;padding:10px 4px 8px;border:2px solid #2d3a47;border-radius:16px;background:linear-gradient(#202a35,#151a21);color:#f5f1e6;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.sw.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.45)}
.sw i{width:26px;height:44px;border-radius:8px;background:var(--c);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),inset 0 8px 0 rgba(255,255,255,.2)}
.sw b{font-size:13px;font-weight:600}
.sw em{font-style:normal;font-size:12px;color:#aab3a3;display:flex;align-items:center;gap:4px}
.sw .c{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.sw.lock{opacity:.55}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:46px;margin:0;line-height:1;color:var(--gold)}
#info{font-family:Bungee,Impact,sans-serif;line-height:1.6;font-size:15px;color:#cfd6c8}
.big{font-family:Bungee,Impact,sans-serif;font-size:52px;color:#fff;line-height:1.1}
.nb{color:var(--hot);font-family:Bungee,Impact,sans-serif;font-size:18px}
#bank{font-size:14px;color:var(--gold);margin-top:6px}
#go{font-family:Bungee,Impact,sans-serif;font-size:26px;padding:14px 44px;border:0;border-radius:14px;background:var(--sign);color:#fff;cursor:pointer;margin-top:6px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#mis{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;width:100%;flex:none}
.ics{display:flex;gap:8px}
.ic{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid #34506a;background:linear-gradient(#25384a,#17222d);font-size:21px;cursor:pointer;color:#fff;padding:0}
.ic i{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#ff3b3b;color:#fff;font:700 13px/20px system-ui;font-style:normal;display:none;align-items:center;justify-content:center}
.cbox{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:#17222d;border:2px solid var(--gold);font-family:Bungee,Impact,sans-serif;color:var(--gold);font-size:17px}
.cbox .c,.fc{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.fc{position:fixed;margin:-8px;z-index:9;pointer-events:none}
h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:26px;margin:0;color:#fff}
.tg{width:100%;max-width:300px;padding:14px;border-radius:14px;border:2px solid #34506a;background:#17222d;color:#fff;font-family:Bungee,Impact,sans-serif;font-size:16px;cursor:pointer;flex:none}
#buy{font-family:Bungee,Impact,sans-serif;font-size:22px;padding:12px 40px;border:0;border-radius:14px;background:var(--hot);color:#fff;cursor:pointer;flex:none}
#buy:disabled{background:#3a3f48;color:#888}
#stat{color:var(--gold);font-size:14px}
#gar{flex-wrap:wrap;justify-content:center;overflow:visible}
.ms{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#223244,#182330);border:2px solid #2d3a47;font-family:Bungee,Impact,sans-serif;font-size:14px;color:#cfe;text-align:left}
.ms.rdy{background:linear-gradient(135deg,#1fae6a,#0f7b4f);border-color:#7bffb8;cursor:pointer;animation:pl 1.2s infinite}
.ms.cl{opacity:.45}
.ms span{color:var(--gold);white-space:nowrap}
@keyframes pl{50%{transform:scale(1.03)}}
#tabs{display:flex;gap:6px;flex:none}
.tb{font-family:Bungee,Impact,sans-serif;font-size:13px;padding:8px 14px;border-radius:999px;border:2px solid #34506a;background:#17222d;color:#cfe;cursor:pointer}
.tb.on{background:var(--sign);border-color:#7bffb8;color:#fff}
#pz{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;justify-content:center;font-size:15px;width:40px;height:40px}
</style></head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<button class="ic" id="pz">&#10074;&#10074;</button>
<div class="ov hide" id="pzov"><h1>Paused</h1><button class="tg" id="res">Resume</button><button class="tg" id="quit">Quit to menu</button></div>
<div class="ov" id="ov">
<div class="bar"><div class="ics"><button class="ic" id="snd">&#128266;</button><button class="ic" id="bset">&#9881;&#65039;</button><button class="ic" id="bshop">&#128722;<i id="badge">!</i></button></div><div class="cbox"><span class="c"></span><b id="cn">0</b></div></div>
<h1 id="ttl">Lane Rush</h1>
<div id="info"></div>
<button id="go">Drive</button>
<canvas id="pv" width="480" height="260"></canvas>
<div id="mis"></div>
</div>
<div class="ov hide" id="shop">
<div class="bar"><button class="ic" id="sback">&#8592;</button><h2>Shop</h2><div class="cbox" id="cbox2"><span class="c"></span><b id="cn2">0</b></div></div>
<div id="tabs"><button class="tb on">Cars</button><button class="tb">Trails</button><button class="tb">Upgrades</button></div>
<canvas id="pv2" width="480" height="260"></canvas>
<div id="name"></div><div id="stat"></div>
<button id="buy">Buy</button>
<div id="gar"></div>
</div>
<div class="ov hide" id="setp">
<div class="bar"><button class="ic" id="xback">&#8592;</button><h2>Settings</h2><span style="width:46px"></span></div>
<button class="tg" id="t1"></button><button class="tg" id="t2"></button><button class="tg" id="t3"></button><button class="tg" id="t4">Reset progress</button>
</div>
<script>
const $=id=>document.getElementById(id);
const C=$('c'),MX=C.getContext('2d'),W=360,H=640,FAR=270,dp=Math.min(2,window.devicePixelRatio||1);
let X=MX;
const OC=document.createElement('canvas'),OX=OC.getContext('2d');OC.width=720*dp;OC.height=(H+FAR)*dp;
C.width=W*dp;C.height=H*dp;X.scale(dp,dp);
const LX=[90,180,270],PY=440;
const CARS=[['#e63946',0,'Ruby'],['#2a9df4',60,'Ocean'],['#ffd23f',150,'Sunny'],['#7bd389',300,'Mint'],['#c77dff',500,'Violet'],['#ff8fab',800,'Blush'],['#f4f4f4',1200,'Ghost'],['#3a3f4b',1800,'Shadow'],['rainbow',3000,'Prism']];
const EC=['#f4a261','#6d6875','#e9c46a','#8ecae6','#b56576','#90be6d'];
const WX=[0,.65,.4],PHASE=20,BG=['#4f9a4b','#6b6f78','#d8b978','#e6eef5'];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
let S={best:0,coins:0,own:[0],sel:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('laneRush')||'{}'))}catch(e){}
S.set=Object.assign({music:1,sfx:1,vib:1},S.set);S.tr=S.tr||0;S.trOwn=S.trOwn||[0];S.up=Object.assign({mag:0,slow:0,sh:0},S.up);
const save=()=>{try{localStorage.setItem('laneRush',JSON.stringify(S))}catch(e){}};

/* audio */
let A=null,eng=null,mute=true;
function snd(){if(A)return;try{A=new(window.AudioContext||window.webkitAudioContext)();eng=A.createOscillator();eng.type='sawtooth';const fl=A.createBiquadFilter();fl.type='lowpass';fl.frequency.value=240;fl.Q.value=2;const g=A.createGain();g.gain.value=0;const l=A.createOscillator(),lg=A.createGain();l.frequency.value=26;lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);l.start();eng.connect(fl);fl.connect(g);g.connect(A.destination);eng.start();eng.g=g;eng.l=l}catch(e){A=null;eng=null}}
function blip(f,d,t='square',v=.07,m){if(!A||mute||!(m?S.set.music:S.set.sfx))return;try{const o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}

/* state */
let st='menu',t=0,score=0,speed=300,combo=0,comboT=0,coinsRun=0,near=0,lane=1,px=180,ents=[],parts=[],texts=[],spT=1,shake=0,off=0,sh=0,pw={mag:0,slow:0},rushT=0,nextRush=50,crashAt=0,ra=0;
let cn=0,path=1,lastIv=1,wsn=0,wsd=0,lastCb=-1,mx=0,shU=0,missGot=[],crashE=null,crashRot=0,shT=0,zf=1,evT=25,stormT=0,metT=0,mt=0,lt=2,flash=0,cop=null,tow=0,towLane=-1,mets=[],tab=0,bolts=[],strikes=0,evN=0;
const mult=()=>Math.min(5,1+Math.floor(combo/2));
function reset(){crashE=null;bolts=[];evN=0;zf=1;evT=25;stormT=0;metT=0;cop=null;tow=0;towLane=-1;mets=[];flash=0;mx=0;shU=0;lastCb=-1;missGot=[];off=0;t=0;path=1;lastIv=1;bioStart=Math.floor(Math.random()*4);bioShift=Math.floor(Math.random()*20);score=0;speed=300;combo=0;comboT=0;coinsRun=0;near=0;lane=1;px=180;ents=[];parts=[];texts=[];spT=.9;shake=0;sh=0;pw={mag:0,slow:0};rushT=0;nextRush=40;}
function msg(s,x,y,c,size){texts.push({s,x,y,c,l:1.1,size:size||20})}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(0,6.3),v=rnd(60,320);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.8),c,r:rnd(2,5)})}}

/* spawning */
const STY=[[44,76],[40,68],[48,98],[52,140],[46,80]];
const pickSty=()=>{const r=Math.random();return r<.35?0:r<.55?1:r<.7?(t>8?2:0):r<.85?4:(t>15?3:0)};
function spawn(shift){
 for(let tries=0;tries<30;tries++){
  let blocked,build;
  if(t>25&&Math.random()<.18){
   const a=Math.random()<.5?0:1;blocked=[a,a+1];
   build=()=>ents.push({k:'truck',x:(LX[a]+LX[a+1])/2,y:-FAR-150,w:150,h:120,v:100,c:pick(EC),c2:pick(EC),sd:Math.random()});
  }else{
   const n=(t<12||Math.random()<.5)?1:2;
   const ls=[0,1,2].sort(()=>Math.random()-.5).slice(0,n);
   const sw=n===1&&t>40&&Math.random()<.3;
   const nl=sw?pick([ls[0]-1,ls[0]+1].filter(x=>x>=0&&x<=2)):-1;
   blocked=sw?[ls[0],nl]:ls;
   build=()=>ls.forEach(l=>{
    if(!sw&&t>20&&Math.random()<.15)ents.push({k:'cone',x:LX[l],y:-FAR-80,w:60,h:28,v:100});
    else ents.push((()=>{const si=pickSty();return{k:'car',x:LX[l],y:-FAR-110,w:STY[si][0],h:STY[si][1],sty:si,v:100,c:pick(EC),l,sw,nl,swT:0}})());
   });
  }
  if(towLane>=0&&blocked.includes(towLane))continue;
  const free=[0,1,2].filter(l=>!blocked.includes(l));
  const ok=free.filter(f=>Math.abs(f-path)<=shift);
  if(!ok.length)continue;
  build();path=pick(ok);
  const r=Math.random(),l=pick(free);
  if(r<.08)ents.push({k:'pu',t:pick('smt'),x:LX[l],y:-FAR-190,w:30,h:30});
  else if(r<.65)for(let i=0;i<4;i++)ents.push({k:'coin',x:LX[l],y:-FAR-140-i*42,w:20,h:20});
  return;
 }
}
function take(k){
 blip(660,.15,'triangle',.08);
 if(k==='s'){sh=1;shT=20+2*S.up.sh;msg('Shield',px,PY-70,'#7ee7ff')}
 if(k==='m'){pw.mag=8+.75*S.up.mag;msg('Magnet',px,PY-70,'#ff5ccd')}
 if(k==='t'){pw.slow=5+.5*S.up.slow;msg('Slow-mo',px,PY-70,'#b79cff')}
}
function nearMiss(){
 combo++;comboT=8;near++;mx=Math.max(mx,mult());vib(15);const add=50*mult();score+=add;
 msg('CLOSE! +'+add,W/2,190,'#ff7a1a',26);blip(880,.1,'triangle',.07);
}
function crash(e){
 if(st!=='play')return;
 st='over';crashAt=performance.now();shake=18;crashE=e;crashRot=(Math.random()<.5?-1:1)*rnd(.06,.14);for(let i=0;i<18;i++)parts.push({x:px+rnd(-14,14),y:PY-30,vx:rnd(-25,25),vy:rnd(-90,-25),l:rnd(.8,1.5),c:'rgba(70,70,75,.55)',r:rnd(6,11)});
 burst(px,PY,40,'#ffb703');burst(px,PY,22,carCol(S.sel));
 crashSnd();if(eng)eng.g.gain.value=0;
 const nb=Math.floor(score)>S.best;if(nb)S.best=Math.floor(score);
 vib(120);missions().forEach(i=>{if(!S.m.done.includes(i)&&POOL[i][1]()){S.m.done.push(i);missGot.push(POOL[i])}});
 S.coins+=coinsRun;save();
 setTimeout(()=>{if(st==='over')show(true,nb)},700);
}

const POOL=[['Get 5 close calls',()=>near>=5,60],['Collect 25 coins',()=>coinsRun>=25,50],['Score 800',()=>score>=800,70],['Reach a 4x combo',()=>mx>=4,80],['Survive 60 seconds',()=>t>=60,90],['Break 2 shields',()=>shU>=2,70]];
function missions(){const d=new Date().toISOString().slice(0,10);if(!S.m||S.m.d!==d)S.m={d,done:[],claimed:[]};if(!S.m.claimed)S.m.claimed=S.m.done.slice();let k=0;for(const ch of d)k=(k*31+ch.charCodeAt(0))%9973;const ix=[];for(let i=0;ix.length<3;i++){const v=(k+i*5)%POOL.length;if(!ix.includes(v))ix.push(v)}return ix}
const vib=n=>{try{S.set.vib&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function crashSnd(){if(!A||mute||!S.set.sfx)return;const n=A.sampleRate*.5|0,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const r=A.createBufferSource(),g=A.createGain();r.buffer=b;g.gain.value=.4;r.connect(g);g.connect(A.destination);r.start();blip(70,.5,'sawtooth',.2);blip(45,.4,'sine',.3)}
function carCol(i){const c=CARS[i][0];if(c!=='rainbow')return c;const h=(performance.now()/12)%360,f=n=>{const k=(n+h/30)%12;return .6-.45*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[0,8,4].map(n=>Math.round(255*f(n)).toString(16).padStart(2,'0')).join('')}
function trailCol(){const k=S.tr;if(k===1)return pick(['#ff7a1a','#ffd23f','#ff3b30']);if(k===2)return pick(['#ffffff','#ffe98a','#bfe9ff']);if(k===3)return rbc();if(k===4)return pick(['#00ffd5','#ff2bd6']);return mult()>2?'#ff7a1a':'rgba(200,200,210,.7)'}
function rbc(){const h=(performance.now()/6)%360,f=n=>{const k=(n+h/30)%12;return .6-.45*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[0,8,4].map(n=>Math.round(255*f(n)).toString(16).padStart(2,'0')).join('')}
function thunder(){blip(55,.9,'sawtooth',.12);blip(38,1,'sine',.25)}
function startTow(){tow=5;ents=ents.filter(e=>e.k==='coin'||e.k==='pu');cop=null;stormT=0;msg('Hang tight!',W/2,150,'#ffd23f',28);blip(500,.15,'triangle',.08)}
function endTow(){spT=1.8;path=lane;lastIv=1;msg('Back on the road!',W/2,150,'#ffffff',26)}
function towDraw(e){
 const x0=e.x-28,x1=e.x+28,y0=e.y-62,y1=e.y+62,f=(performance.now()/200|0)%2,pl=.5+.5*Math.sin(performance.now()/180);
 X.fillStyle='rgba(0,0,0,.28)';X.fillRect(x0+4,y0+6,56,124);
 X.strokeStyle=`rgba(255,212,0,${.35+.4*pl})`;X.lineWidth=4;X.strokeRect(x0-8,y0-14,72,152);
 box(x0,y0,x1,y1-38,2,7,'#59606b');box(x0+8,y0-12,x1-8,y0,0,3,'#d9d9d9');
 box(x0+2,y1-38,x1-2,y1,2,28,'#ffd400');
 quad(P(x0+8,y1,14),P(x1-8,y1,14),P(x1-8,y1,23),P(x0+8,y1,23),'#16222e');
 for(const lx of [x0+4,x1-12])quad(P(lx,y1,5),P(lx+8,y1,5),P(lx+8,y1,9),P(lx,y1,9),'#fff6b0');
 box(e.x-10,y1-26,e.x+10,y1-18,28,32,f?'#ffb000':'#664400');
 const g=P(e.x,y1-22,34);X.globalCompositeOperation='lighter';glow(g[0],g[1],60,'255,190,0',f?.55:.25);glow(e.x,e.y,90,'255,210,0',.18+.15*pl);X.globalCompositeOperation='source-over';
 const q=P(e.x,e.y,58);T('TOW',q[0],q[1],24,'#ffd400');
}
function towUnder(){const x0=px-28,x1=px+28;box(x0,PY-62,x1,PY-30,2,24,'#e6a100');box(x0,PY-30,x1,PY+66,2,7,'#8a8f9a');quad(P(x0+6,PY-30,12),P(x1-6,PY-30,12),P(x1-6,PY-30,20),P(x0+6,PY-30,20),'#16222e')}
function copDraw(){
 const f=(performance.now()/180|0)%2,y=PY+cop.d;
 car(cop.x,y,44,76,'#1d2b4f',false);
 box(cop.x-14,y-4,cop.x-2,y+6,19,23,f?'#ff2a2a':'#5a1111');box(cop.x+2,y-4,cop.x+14,y+6,19,23,f?'#10306a':'#2a6bff');
 const g=P(cop.x,y,22);X.globalCompositeOperation='lighter';glow(g[0]-8,g[1],46,f?'255,40,40':'0,0,0',.8);glow(g[0]+8,g[1],46,f?'0,0,0':'60,120,255',.8);X.globalCompositeOperation='source-over';
}
function drawMets(){
 for(const m of mets){const p=m.t/.6,x=m.sx+(m.tx-m.sx)*p,y=m.sy+(m.ty-m.sy)*p;
  X.strokeStyle='rgba(255,170,60,.8)';X.lineWidth=5;X.beginPath();X.moveTo(x,y);X.lineTo(x-(m.tx-m.sx)*.18,y-(m.ty-m.sy)*.18);X.stroke();
  X.fillStyle='#fff3c0';X.beginPath();X.arc(x,y,7,0,7);X.fill();
  X.globalCompositeOperation='lighter';glow(x,y,34,'255,150,40',.8);X.globalCompositeOperation='source-over'}
}
function drawBolts(){for(const b of bolts){const a=cl(1-b.t/.25,0,1);X.lineJoin='round';X.beginPath();b.p.forEach(([dx,dy],i)=>i?X.lineTo(b.x+dx,b.y+dy):X.moveTo(b.x+dx,b.y+dy));X.strokeStyle=`rgba(150,180,255,${a*.4})`;X.lineWidth=12;X.stroke();X.strokeStyle=`rgba(235,242,255,${a})`;X.lineWidth=4;X.stroke();X.globalCompositeOperation='lighter';glow(b.x,b.y,55,'200,220,255',a*.9);X.globalCompositeOperation='source-over'}}
let sir=null;
function sirenOn(){if(!A||sir)return;try{const o=A.createOscillator(),g=A.createGain();o.type='sawtooth';g.gain.value=0;o.connect(g);g.connect(A.destination);o.start();sir={o,g}}catch(e){}}
let mus=0,ms=0;
